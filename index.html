<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Chissanucha Fadsura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: '#1A365D',
                        gold: '#D4AF37',
                        lightblue: '#EBF8FF'
                    },
                    fontFamily: {
                        sans: ['Sarabun', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.9); }
        
        /* Loading Overlay */
        #loader { display: flex; }
        .spinner { border: 4px solid rgba(212, 175, 55, 0.3); border-left-color: #D4AF37; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-slate-900 dark:text-gray-200 transition-colors duration-300">

    <nav class="glass-nav fixed w-full z-50 border-b border-gold/30 shadow-sm top-0 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Hamburger Menu -->
                <div class="flex items-center">
                    <button id="menu-btn" class="text-navy dark:text-gold p-2 rounded-md focus:outline-none hover:bg-gray-200 dark:hover:bg-slate-700 transition">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <span class="ml-4 font-bold text-xl text-navy dark:text-gold hidden sm:block lang-th">Portfolio Chissanucha Fadsura</span>
                    <span class="ml-4 font-bold text-xl text-navy dark:text-gold hidden sm:block lang-en hidden">Portfolio Chissanucha Fadsura</span>
                </div>
                
                <!-- Right Controls -->
                <div class="flex items-center space-x-4">
                    <!-- Translate Toggle -->
                    <button onclick="toggleLang()" class="text-sm font-semibold px-3 py-1 rounded-full border border-navy text-navy dark:border-gold dark:text-gold hover:bg-navy hover:text-white dark:hover:bg-gold dark:hover:text-slate-900 transition">
                        <span id="lang-text">TH/EN</span>
                    </button>
                    
                    <!-- Dark Mode Toggle -->
                    <button onclick="toggleTheme()" class="text-navy dark:text-gold p-2 rounded-full hover:bg-gray-200 dark:hover:bg-slate-700 transition">
                        <i id="theme-icon" class="fas fa-moon"></i>
                    </button>

                    <!-- Login Button -->
                    <button id="auth-btn" onclick="openLoginModal()" class="bg-navy text-white dark:bg-gold dark:text-slate-900 px-4 py-1.5 rounded-lg text-sm font-bold shadow-md hover:opacity-80 transition">
                        <span class="lang-th">เข้าสู่ระบบ</span><span class="lang-en hidden">Login</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full w-64 bg-white dark:bg-slate-800 shadow-xl z-40 transition-transform duration-300 pt-16">
        <ul class="p-4 space-y-2">
            <li><a href="#" onclick="navigate('portfolio')" class="block p-3 rounded-lg hover:bg-lightblue dark:hover:bg-slate-700 text-navy dark:text-gold font-semibold"><i class="fas fa-user mr-2"></i> Portfolio</a></li>
            <li class="auth-required hidden"><a href="#" onclick="navigate('readSchedule')" class="block p-3 rounded-lg hover:bg-lightblue dark:hover:bg-slate-700 text-navy dark:text-gold font-semibold"><i class="fas fa-clock mr-2"></i> Reading schedule</a></li>
            <li class="auth-required hidden"><a href="#" onclick="navigate('listReading')" class="block p-3 rounded-lg hover:bg-lightblue dark:hover:bg-slate-700 text-navy dark:text-gold font-semibold"><i class="fas fa-book mr-2"></i> List Reading</a></li>
            <li class="auth-required hidden"><a href="#" onclick="navigate('workTimetable')" class="block p-3 rounded-lg hover:bg-lightblue dark:hover:bg-slate-700 text-navy dark:text-gold font-semibold"><i class="fas fa-tasks mr-2"></i> Work timetable</a></li>
            <li class="auth-required hidden"><a href="#" onclick="navigate('scoreTest')" class="block p-3 rounded-lg hover:bg-lightblue dark:hover:bg-slate-700 text-navy dark:text-gold font-semibold"><i class="fas fa-star mr-2"></i> ScoreTest</a></li>
        </ul>
    </div>

    <main class="pt-20 pb-24 min-h-screen max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 transition-all duration-300" id="main-content">
        <!-- Views will be injected here by JS -->
    </main>

    <footer class="fixed bottom-0 w-full bg-navy text-white text-center py-3 text-sm z-30">
        ©Portfolio Chissanucha Fadsura ALLRIGHT RESERVED
    </footer>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[60] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-4 border-navy dark:border-gold relative">
            <button onclick="closeModals()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-2xl font-bold text-navy dark:text-gold mb-6 text-center">เข้าสู่ระบบ (Admin)</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <input type="text" id="username" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-navy dark:bg-slate-700 dark:border-gray-600">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-navy dark:bg-slate-700 dark:border-gray-600">
                </div>
                <button onclick="performLogin()" class="w-full bg-navy text-white dark:bg-gold dark:text-slate-900 font-bold py-2 rounded-lg hover:opacity-90 transition mt-4">Login</button>
            </div>
        </div>
    </div>

    <!-- Generic Form Modal for adding data -->
    <div id="form-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[60] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto border-t-4 border-gold relative">
            <button onclick="closeModals()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            <h2 id="form-modal-title" class="text-xl font-bold text-navy dark:text-gold mb-4">เพิ่มข้อมูล</h2>
            <form id="dynamic-form" class="space-y-4" onsubmit="submitFormData(event)">
                <!-- Form fields injected here -->
            </form>
        </div>
    </div>

    <!-- Full Screen Loader -->
    <div id="loader" class="fixed inset-0 bg-white/80 dark:bg-slate-900/80 z-[100] flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="spinner mb-4"></div>
        <p class="text-navy dark:text-gold font-semibold animate-pulse">กำลังโหลดข้อมูล...</p>
    </div>

    <script>
        // === CONFIGURATION ===
        // นำ URL Web App ของคุณมาใส่ที่นี่
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz7LzSeNWo7zs1cDpaPmj0Ipuh7B5Qh9zIjKO2rar8E3JajUFamdgIHYQtZPhXbGWArHg/exec"; 
        
        let globalData = { record: [], award: [], read: [], subject: [], work: [], scoreTest: [], list: [] };
        let isLoggedIn = false;
        let isEng = false;

        // Initialize
        window.onload = async () => {
            initTheme();
            setupSidebar();
            await fetchData();
            navigate('portfolio');
        };

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                icon.classList.replace('fa-sun', 'fa-moon');
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                icon.classList.replace('fa-moon', 'fa-sun');
            }
        }

        function toggleLang() {
            isEng = !isEng;
            document.querySelectorAll('.lang-th').forEach(el => el.classList.toggle('hidden', isEng));
            document.querySelectorAll('.lang-en').forEach(el => el.classList.toggle('hidden', !isEng));
            renderCurrentView(); // Re-render for translation
        }

        function setupSidebar() {
            const btn = document.getElementById('menu-btn');
            const sidebar = document.getElementById('sidebar');
            btn.onclick = () => sidebar.classList.toggle('-translate-x-full');
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && !btn.contains(e.target)) {
                    sidebar.classList.add('-translate-x-full');
                }
            });
        }

        async function fetchData() {
            showLoader();
            // ตั้งเวลา Timeout 3.5 วินาที หากนานกว่านี้ให้ตัดจบเพื่อไม่ให้ระบบค้าง
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3500); 

            try {
                // If using GitHub, use POST. If CORS fails, consider setting up a proxy or using JSONP. 
                // Using POST based on the provided GAS script.
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getData' }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const res = await response.json();
                if(res.status === 'success') {
                    globalData = { ...globalData, ...res.data };
                } else {
                    throw new Error("Invalid response format");
                }
            } catch (error) {
                console.warn("API Data Error or Timeout. Loading Mock Data...", error);
                // Mock data for display if API is not set yet or takes too long
                mockData();
            }
            hideLoader();
        }

        function mockData() {
            globalData = {
                record: [["","","","","","Small Text 1","LogoUrl","School Name","Affiliation","Address","GPA","Religion","Motto","Talent1, Talent2","2005-10-15","Father Name","Mother Name","Address info","0812345678","tel:0812345678","ig_acc","url","fb","url","threads","url","line","url"]],
                award: [], read: [], subject: [], work: [], scoreTest: [], list: []
            };
        }

        let currentView = 'portfolio';
        function navigate(view) {
            currentView = view;
            document.getElementById('sidebar').classList.add('-translate-x-full');
            renderCurrentView();
        }

        function renderCurrentView() {
            const main = document.getElementById('main-content');
            main.innerHTML = '';
            
            if(currentView === 'portfolio') renderPortfolio(main);
            else if(currentView === 'readSchedule' && isLoggedIn) renderReadSchedule(main);
            else if(currentView === 'listReading' && isLoggedIn) renderListReading(main);
            else if(currentView === 'workTimetable' && isLoggedIn) renderWorkTimetable(main);
            else if(currentView === 'scoreTest' && isLoggedIn) renderScoreTest(main);
            else main.innerHTML = '<p class="text-center mt-20 text-red-500">Please Login / กรุณาเข้าสู่ระบบ</p>';
        }

        function renderPortfolio(container) {
            const r = globalData.record && globalData.record[0] ? globalData.record[0] : Array(30).fill('');
            
            // Age Calculation
            const dob = new Date(r[14]); // O3 (index 14)
            let age = "";
            if(!isNaN(dob)) {
                const diff = Date.now() - dob.getTime();
                const ageDt = new Date(diff); 
                age = Math.abs(ageDt.getUTCFullYear() - 1970) + " ปี " + ageDt.getUTCMonth() + " เดือน";
            }

            const t = (th, en) => isEng ? en : th;

            let html = `
                <div class="space-y-8 animate-fade-in">
                    <h1 class="text-3xl md:text-5xl font-bold text-navy dark:text-gold text-center my-6">Portfolio</h1>
                    
                    <!-- Profile Section -->
                    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-6 relative flex flex-col md:flex-row gap-6 items-center md:items-start border-t-4 border-navy">
                        ${renderGear('recordProfile')}
                        <img src="${r[6] || 'https://placehold.co/200x200/1A365D/FFF?text=Photo'}" class="w-48 h-48 rounded-2xl object-cover shadow-md border-2 border-gold">
                        <div class="flex-1">
                            <h2 class="text-2xl font-bold text-navy dark:text-gold">${r[7]}</h2>
                            <h3 class="text-xl text-gray-600 dark:text-gray-300 mb-2">${r[8]}</h3>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">${r[5]}</p>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm">
                                <div><span class="font-bold">${t('วันเกิด', 'DOB')}:</span> ${formatThaiDate(r[14])}</div>
                                <div><span class="font-bold">${t('อายุ', 'Age')}:</span> ${age}</div>
                                <div><span class="font-bold">${t('เชื้อชาติ', 'Race')}:</span> ${r[9]}</div>
                                <div><span class="font-bold">${t('สัญชาติ', 'Nationality')}:</span> ${r[10]}</div>
                                <div><span class="font-bold">${t('ศาสนา', 'Religion')}:</span> ${r[11]}</div>
                            </div>
                            
                            <div class="mt-4 p-3 bg-lightblue dark:bg-slate-700 rounded-xl border border-blue-200 dark:border-slate-600">
                                <span class="font-bold text-navy dark:text-gold">${t('คติประจำใจ', 'Motto')}:</span> 
                                <span class="italic">"${r[12]}"</span>
                            </div>
                            
                            <div class="mt-4">
                                <span class="font-bold">${t('ความสามารถพิเศษ', 'Talents')}:</span>
                                <ul class="list-disc list-inside text-sm mt-1">
                                    ${String(r[13]).split(',').map(item => `<li>${item.trim()}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Family -->
                        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-6 relative border-t-4 border-gold">
                             ${renderGear('recordFamily')}
                             <h3 class="text-xl font-bold text-navy dark:text-gold mb-4"><i class="fas fa-home mr-2"></i>${t('ครอบครัว', 'Family')}</h3>
                             <p><span class="font-bold">${t('บิดา', 'Father')}:</span> ${r[15]}</p>
                             <p><span class="font-bold">${t('มารดา', 'Mother')}:</span> ${r[16]}</p>
                             <p class="mt-2"><span class="font-bold">${t('ที่อยู่', 'Address')}:</span> ${r[17]}</p>
                        </div>
                        
                        <!-- Contact -->
                        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-6 relative border-t-4 border-gold">
                             ${renderGear('recordContact')}
                             <h3 class="text-xl font-bold text-navy dark:text-gold mb-4"><i class="fas fa-address-book mr-2"></i>${t('การติดต่อ', 'Contact')}</h3>
                             <div class="space-y-2">
                                <a href="${r[19]}" target="_blank" class="flex items-center text-navy dark:text-blue-300 hover:underline"><i class="fas fa-phone w-6"></i> ${r[18]}</a>
                                <a href="${r[21]}" target="_blank" class="flex items-center text-pink-600 dark:text-pink-400 hover:underline"><i class="fab fa-instagram w-6"></i> ${r[20]}</a>
                                <a href="${r[27]}" target="_blank" class="flex items-center text-green-500 hover:underline"><i class="fab fa-line w-6"></i> ${r[26]}</a>
                                <a href="${r[23]}" target="_blank" class="flex items-center text-blue-600 dark:text-blue-400 hover:underline"><i class="fab fa-facebook w-6"></i> ${r[22]}</a>
                                <a href="${r[25]}" target="_blank" class="flex items-center text-gray-800 dark:text-gray-300 hover:underline"><i class="fa-brands fa-threads w-6"></i> ${r[24]}</a>
                             </div>
                        </div>
                    </div>

                    <!-- Education -->
                    <div class="bg-lightblue dark:bg-slate-800 rounded-2xl shadow-lg p-6 relative border-2 border-blue-200 dark:border-navy">
                        ${renderGear('recordEdu')}
                        <h3 class="text-2xl font-bold text-navy dark:text-gold mb-4 text-center"><i class="fas fa-graduation-cap mr-2"></i>${t('ประวัติการศึกษา', 'Education')}</h3>
                        <div class="flex flex-col md:flex-row items-center justify-center gap-6 text-center md:text-left">
                            <img src="${r[0] || 'https://placehold.co/100x100/FFF/000?text=Logo'}" class="w-24 h-24 rounded-full shadow-md bg-white p-1">
                            <div>
                                <h4 class="text-2xl font-bold text-navy dark:text-white">${r[1]}</h4>
                                <p class="text-lg text-gray-700 dark:text-gray-300">${r[2]}</p>
                                <p class="text-sm text-gray-500">${r[3]}</p>
                                <p class="mt-2 text-lg font-bold text-gold bg-navy px-3 py-1 rounded-full inline-block">GPA: ${r[4]}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Awards (List mapped from Award Sheet) -->
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-2xl font-bold text-navy dark:text-gold"><i class="fas fa-trophy mr-2"></i>${t('ผลงาน', 'Awards')}</h3>
                            ${renderGear('award', true)}
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${(globalData.award || []).map(aw => renderAwardCard(aw)).join('')}
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function renderAwardCard(aw) {
            // Mapping based on prompt: I=8(Img), D=3(Level), E=4(Priv), F=5(Medal), G=6(Name), H=7(Org), B=1(Date), C=2(Grade), J=9(Winners), K=10(Advisors), L=11(Desc)
            return `
            <div class="bg-lightblue dark:bg-slate-800 rounded-2xl shadow-md overflow-hidden border border-blue-100 dark:border-slate-700 flex flex-col">
                <img src="${aw[8] || 'https://placehold.co/400x200/D4AF37/FFF?text=Award'}" class="w-full h-48 object-cover">
                <div class="p-4 flex-1 flex flex-col">
                    <div class="flex flex-wrap gap-2 mb-2">
                        <span class="text-[10px] px-2 py-1 border border-gold text-gold rounded-full bg-white dark:bg-slate-700 font-bold">${aw[3]}</span>
                        <span class="text-[10px] px-2 py-1 border border-gray-400 text-gray-600 dark:text-gray-300 rounded-full bg-white dark:bg-slate-700">${aw[4]}</span>
                        <span class="text-[10px] px-2 py-1 border border-green-500 text-green-600 dark:text-green-400 rounded-full bg-white dark:bg-slate-700">${aw[5]}</span>
                    </div>
                    <h4 class="text-lg font-bold text-navy dark:text-white leading-tight mb-1">${aw[6]}</h4>
                    <p class="text-xs text-gray-500 mb-2">${aw[7]}</p>
                    <div class="text-[10px] text-gray-500 dark:text-gray-400 mb-2 space-y-1">
                        <p><i class="far fa-calendar mr-1"></i> ${formatThaiDate(aw[1])}</p>
                        <p><i class="fas fa-layer-group mr-1"></i> ชั้น ${aw[2]}</p>
                    </div>
                    <div class="mt-auto">
                        <p class="text-[10px] font-bold mt-2">ผู้ได้รับรางวัล:</p>
                        <ul class="text-[10px] list-disc list-inside text-gray-600 dark:text-gray-300">
                            ${String(aw[9]).split(',').map(x => `<li>${x.trim()}</li>`).join('')}
                        </ul>
                        <p class="text-[10px] font-bold mt-1">ครูที่ปรึกษา:</p>
                        <ul class="text-[10px] list-disc list-inside text-gray-600 dark:text-gray-300 mb-2">
                            ${String(aw[10]).split(',').map(x => `<li>${x.trim()}</li>`).join('')}
                        </ul>
                        <p class="text-xs bg-white dark:bg-slate-700 p-2 rounded border border-gray-200 dark:border-gray-600 italic">"${aw[11]}"</p>
                    </div>
                </div>
            </div>`;
        }

        // Reading Schedule
        function renderReadSchedule(container) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-6 animate-fade-in">
                    <h2 class="text-3xl font-bold text-navy dark:text-gold text-center"><i class="fas fa-clock mr-2"></i> Reading Schedule</h2>
                    <div class="bg-navy text-white p-4 rounded-xl shadow-lg text-center border-b-4 border-gold">
                        <div id="realtime-date" class="text-lg mb-1"></div>
                        <div id="realtime-clock" class="text-4xl font-bold font-mono tracking-wider text-gold"></div>
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow p-4">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs uppercase bg-gray-100 dark:bg-slate-700">
                                <tr><th class="px-4 py-3 rounded-tl-lg">เวลา (Time)</th><th class="px-4 py-3 rounded-tr-lg">กิจกรรม (Activity)</th></tr>
                            </thead>
                            <tbody id="schedule-body">
                                <!-- JS mapped -->
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            updateClock();
            setInterval(updateClock, 1000);
            
            // Map Schedule logic (Simple mock mapping for concept)
            const tbody = document.getElementById('schedule-body');
            const data = globalData.read;
            if(data.length > 0) {
                // Assuming A=0 is Time, B=1... are days.
                data.forEach(row => {
                    // Current time check logic could be added here to highlight row
                    tbody.innerHTML += `
                        <tr class="border-b dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-600">
                            <td class="px-4 py-3 font-bold text-navy dark:text-gold w-1/3">${row[0]}</td>
                            <td class="px-4 py-3">${row[1] || '-'}</td>
                        </tr>
                    `;
                });
            }
        }

        function updateClock() {
            const now = new Date();
            const dateEl = document.getElementById('realtime-date');
            const clockEl = document.getElementById('realtime-clock');
            if(dateEl && clockEl) {
                dateEl.innerText = formatThaiDate(now);
                clockEl.innerText = now.toLocaleTimeString('th-TH');
            }
        }

        // List Reading
        function renderListReading(container) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-4 animate-fade-in">
                    <h2 class="text-3xl font-bold text-navy dark:text-gold text-center mb-6"><i class="fas fa-book mr-2"></i> List Reading</h2>
                    <div id="reading-list-container" class="space-y-4"></div>
                </div>
            `;
            
            // Grouping logic (Grade -> Subject -> Unit -> Sub)
            // Column Mapping (based on prompt): C=2 (Grade), B=1 (Subject), D=3 (Unit), E=4 (Sub)
            const grouped = {};
            (globalData.subject || []).forEach(row => {
                const grade = row[2], subj = row[1], unit = row[3], sub = row[4];
                if(!grouped[grade]) grouped[grade] = {};
                if(!grouped[grade][subj]) grouped[grade][subj] = {};
                if(!grouped[grade][subj][unit]) grouped[grade][subj][unit] = [];
                grouped[grade][subj][unit].push(sub);
            });

            let html = '';
            for(const grade in grouped) {
                html += `<div class="bg-white dark:bg-slate-800 rounded-xl shadow p-4 border-l-4 border-navy"><h3 class="font-bold text-lg mb-2">ระดับชั้น: ${grade}</h3><div class="pl-4 space-y-2">`;
                for(const subj in grouped[grade]) {
                    html += `<details class="bg-gray-50 dark:bg-slate-700 rounded p-2"><summary class="font-semibold cursor-pointer outline-none">${subj}</summary><div class="pl-4 mt-2 space-y-2">`;
                    for(const unit in grouped[grade][subj]) {
                        html += `
                            <div class="border border-gray-200 dark:border-slate-600 rounded p-2 bg-white dark:bg-slate-800">
                                <label class="flex items-center space-x-2 font-semibold text-navy dark:text-gold">
                                    <input type="checkbox" class="rounded text-navy focus:ring-navy" onclick="toggleUnit(this)">
                                    <span>${unit}</span>
                                </label>
                                <div class="pl-6 mt-1 space-y-1 sub-items">
                                    ${grouped[grade][subj][unit].map(sub => `
                                        <label class="flex items-center space-x-2 text-sm">
                                            <input type="checkbox" class="rounded text-gold focus:ring-gold" onchange="saveChecklist('${sub}')">
                                            <span>${sub}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                    html += `</div></details>`;
                }
                html += `</div></div>`;
            }
            document.getElementById('reading-list-container').innerHTML = html || '<p>ไม่มีข้อมูล</p>';
        }

        function toggleUnit(checkbox) {
            const subs = checkbox.closest('div').querySelectorAll('.sub-items input[type="checkbox"]');
            subs.forEach(cb => cb.checked = checkbox.checked);
        }

        // Work Timetable
        function renderWorkTimetable(container) {
            container.innerHTML = `
                <div class="space-y-6 animate-fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-3xl font-bold text-navy dark:text-gold"><i class="fas fa-tasks mr-2"></i> Work Timetable</h2>
                        ${renderGear('work', true)}
                    </div>
                    <div class="overflow-x-auto bg-white dark:bg-slate-800 rounded-xl shadow">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs uppercase bg-navy text-white">
                                <tr>
                                    <th class="px-4 py-3">Done</th>
                                    <th class="px-4 py-3">กำหนดส่ง</th>
                                    <th class="px-4 py-3">รหัส/วิชา</th>
                                    <th class="px-4 py-3">ชื่องาน</th>
                                    <th class="px-4 py-3">สถานที่ส่ง</th>
                                    <th class="px-4 py-3">ไฟล์/ที่มา</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${(globalData.work || []).map(w => {
                                    // A=0(Check), I=8(Due), C=2(Code), D=3(Subj), E=4(Teach), F=5(Task), G=6(Src), J=9(Loc)
                                    const isOverdue = new Date(w[8]) < new Date();
                                    const dueClass = isOverdue ? 'text-red-500 font-bold' : '';
                                    return `
                                    <tr class="border-b dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-700">
                                        <td class="px-4 py-3"><input type="checkbox" class="rounded w-4 h-4" ${w[0] ? 'checked' : ''}></td>
                                        <td class="px-4 py-3 ${dueClass}">${formatThaiDate(w[8], true)}</td>
                                        <td class="px-4 py-3">
                                            <div class="font-bold">${w[2]}</div>
                                            <div class="text-xs text-gray-500">${w[3]}</div>
                                        </td>
                                        <td class="px-4 py-3 font-semibold">${w[5]}</td>
                                        <td class="px-4 py-3">${w[9]}</td>
                                        <td class="px-4 py-3">
                                            ${w[6].includes('http') ? `<a href="${w[6]}" target="_blank" class="text-blue-500 hover:underline"><i class="fas fa-link"></i> Link</a>` : w[6]}
                                        </td>
                                    </tr>
                                    `
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ScoreTest
        function renderScoreTest(container) {
            container.innerHTML = `
                <div class="space-y-6 animate-fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-3xl font-bold text-navy dark:text-gold"><i class="fas fa-star mr-2"></i> ScoreTest</h2>
                        ${renderGear('scoreTest', true)}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${(globalData.scoreTest || []).map(s => {
                            // A=0(Name), B=1(Center), C=2(Round), D=3(Subj), E=4(Score), F=5(Max), G=6(Img)
                            return `
                            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-lg overflow-hidden border-t-4 border-navy">
                                <img src="${s[6] || 'https://placehold.co/400x150/1A365D/FFF?text=Test'}" class="w-full h-32 object-cover">
                                <div class="p-4">
                                    <h3 class="text-xl font-bold text-navy dark:text-gold">${s[0]}</h3>
                                    <p class="text-xs text-gray-500 mb-3">${s[1]} ${s[2] ? `(รอบ ${s[2]})` : ''}</p>
                                    <div class="bg-gray-50 dark:bg-slate-700 p-3 rounded-lg flex justify-between items-center">
                                        <span class="font-semibold">${s[3]}</span>
                                        <span class="text-lg font-bold text-gold">${s[4]} / ${s[5]}</span>
                                    </div>
                                </div>
                            </div>
                            `
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function formatThaiDate(dateStr, includeTime = false) {
            if(!dateStr) return '-';
            const d = new Date(dateStr);
            if(isNaN(d)) return dateStr;
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            let res = d.toLocaleDateString('th-TH', options);
            if(includeTime) res += ' ' + d.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'}) + ' น.';
            return res;
        }

        function renderGear(type, isButton = false) {
            if(!isLoggedIn) return '';
            if(isButton) {
                return `<button onclick="openFormModal('${type}')" class="bg-gold text-slate-900 px-3 py-1 rounded shadow hover:bg-yellow-500 text-sm"><i class="fas fa-plus mr-1"></i> เพิ่มข้อมูล</button>`;
            }
            return `<button onclick="openFormModal('${type}')" class="absolute top-2 right-2 text-gray-400 hover:text-navy dark:hover:text-gold transition"><i class="fas fa-cog text-xl"></i></button>`;
        }

        function openLoginModal() {
            if(isLoggedIn) {
                // Logout logic
                isLoggedIn = false;
                document.getElementById('auth-btn').innerHTML = '<span class="lang-th">เข้าสู่ระบบ</span><span class="lang-en hidden">Login</span>';
                document.querySelectorAll('.auth-required').forEach(el => el.classList.add('hidden'));
                navigate('portfolio');
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        }

        function closeModals() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('form-modal').classList.add('hidden');
        }

        async function performLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            // Note: In real production without proper backend, this is a mock. 
            // We use the GAS backend to verify.
            showLoader();
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username: u, password: p })
                });
                const data = await res.json();
                if(data.data.success) {
                    isLoggedIn = true;
                    closeModals();
                    document.getElementById('auth-btn').innerHTML = '<span class="lang-th">ออกจากระบบ</span><span class="lang-en hidden">Logout</span>';
                    document.querySelectorAll('.auth-required').forEach(el => el.classList.remove('hidden'));
                    navigate('portfolio');
                } else {
                    alert('Login Failed: ' + data.data.message);
                }
            } catch (error) {
                // Fallback mock login for preview
                if(u==='admin' && p==='1234') {
                    isLoggedIn = true;
                    closeModals();
                    document.getElementById('auth-btn').innerHTML = '<span class="lang-th">ออกจากระบบ</span><span class="lang-en hidden">Logout</span>';
                    document.querySelectorAll('.auth-required').forEach(el => el.classList.remove('hidden'));
                    navigate('portfolio');
                } else {
                    alert('Mock Login Failed (Use admin/1234)');
                }
            }
            hideLoader();
        }

        function showLoader() { document.getElementById('loader').classList.remove('hidden'); }
        function hideLoader() { document.getElementById('loader').classList.add('hidden'); }

        function openFormModal(type) {
            const modal = document.getElementById('form-modal');
            const title = document.getElementById('form-modal-title');
            const form = document.getElementById('dynamic-form');
            form.innerHTML = '';
            
            // Build form based on type (Simplified versions of the requested forms)
            if(type === 'work') {
                title.innerText = "เพิ่มข้อมูล Work Timetable";
                // Populate dropdowns from List sheet
                let subjOptions = globalData.list.map(l => `<option value="${l[0]}">${l[0]} - ${l[1]}</option>`).join('');
                
                form.innerHTML = `
                    <input type="hidden" name="sheetName" value="Work">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-sm">รหัสวิชา</label><select name="col3" class="w-full p-2 border rounded dark:bg-slate-700">${subjOptions}</select></div>
                        <div><label class="text-sm">ชื่องาน</label><input type="text" name="col6" class="w-full p-2 border rounded dark:bg-slate-700" required></div>
                        <div><label class="text-sm">กำหนดส่ง (วันที่/เวลา)</label><input type="datetime-local" name="col9" class="w-full p-2 border rounded dark:bg-slate-700" required></div>
                        <div><label class="text-sm">สถานที่ส่ง</label><input type="text" name="col10" class="w-full p-2 border rounded dark:bg-slate-700"></div>
                        <div class="col-span-2"><label class="text-sm">แนบไฟล์ลง Drive</label><input type="file" id="fileUpload" class="w-full p-2 border rounded dark:bg-slate-700"></div>
                    </div>
                    <button type="submit" class="w-full mt-4 bg-navy text-white py-2 rounded font-bold hover:bg-opacity-80">บันทึก</button>
                `;
            } else if (type === 'award') {
                title.innerText = "เพิ่มผลงาน (Award)";
                form.innerHTML = `
                    <input type="hidden" name="sheetName" value="Award">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-sm">ชื่อผลงาน</label><input type="text" name="col7" class="w-full p-2 border rounded dark:bg-slate-700" required></div>
                        <div><label class="text-sm">ระดับรางวัล</label><select name="col4" class="w-full p-2 border rounded dark:bg-slate-700"><option>ระดับประเทศ</option><option>ระดับภาค</option></select></div>
                        <div><label class="text-sm">วันที่ได้รับ</label><input type="date" name="col2" class="w-full p-2 border rounded dark:bg-slate-700" required></div>
                        <div><label class="text-sm">คำอธิบาย/ความรู้สึก</label><textarea name="col12" class="w-full p-2 border rounded dark:bg-slate-700"></textarea></div>
                    </div>
                    <button type="submit" class="w-full mt-4 bg-navy text-white py-2 rounded font-bold hover:bg-opacity-80">บันทึก</button>
                `;
            }
            // Add other forms (recordProfile, scoreTest, etc.) following the same pattern
            else {
                title.innerText = "กำลังพัฒนาแบบฟอร์มนี้";
                form.innerHTML = `<p>แบบฟอร์มสำหรับ ${type} อยู่ระหว่างจัดทำ</p>`;
            }

            modal.classList.remove('hidden');
        }

        async function submitFormData(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const sheetName = formData.get('sheetName');
            
            // Dummy logic to gather row data based on form inputs
            let rowData = Array(20).fill(''); 
            for (let [key, value] of formData.entries()) {
                if(key.startsWith('col')) {
                    let idx = parseInt(key.replace('col', '')) - 1;
                    rowData[idx] = value;
                }
            }

            // Handle File Upload if exists
            const fileInput = document.getElementById('fileUpload');
            if(fileInput && fileInput.files.length > 0) {
                showLoader();
                const file = fileInput.files[0];
                const base64 = await toBase64(file);
                
                try {
                    const uploadRes = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'uploadFile',
                            base64: base64.split(',')[1],
                            filename: file.name,
                            mimeType: file.type
                        })
                    });
                    const uploadData = await uploadRes.json();
                    if(uploadData.status === 'success') {
                        rowData[6] = uploadData.data; // Save Drive URL to specific column
                    }
                } catch(e) { console.error("Upload failed", e); }
            }

            // Save Data to Sheet
            showLoader();
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'saveData', sheetName: sheetName, rowData: rowData })
                });
                alert("บันทึกข้อมูลเรียบร้อย");
                closeModals();
                await fetchData(); // Refresh data
                renderCurrentView();
            } catch (error) {
                alert("บันทึกข้อมูลล้มเหลว (Mock mode works)");
                closeModals();
            }
            hideLoader();
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

    </script>
