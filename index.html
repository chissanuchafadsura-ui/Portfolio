<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Chissanucha Fadsura</title>
  <style>
    :root {
      --navy: #16324f;
      --navy2: #1f4e79;
      --gold: #c9a227;
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #17222e;
      --muted: #5f6f7f;
      --blue-soft: #e8f2ff;
      --border: #dbe5f0;
    }

    body.dark {
      --bg: #0e1520;
      --card: #16202c;
      --text: #e8eef5;
      --muted: #9fb0c0;
      --blue-soft: #17293d;
      --border: #26384b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Sarabun", "Noto Sans Thai", sans-serif;
      transition: .25s;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      border-bottom: 2px solid var(--gold);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-weight: 800;
      color: var(--navy);
      font-size: 18px;
    }

    body.dark .brand { color: var(--gold); }

    .top-actions { display: flex; gap: 8px; }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    .menu-btn { font-size: 22px; }

    nav {
      position: fixed;
      inset: 0 auto 0 0;
      width: 280px;
      max-width: 85vw;
      background: var(--card);
      border-right: 2px solid var(--gold);
      padding: 18px;
      transform: translateX(-105%);
      transition: .25s;
      z-index: 100;
    }

    nav.open { transform: translateX(0); }

    nav a {
      display: block;
      padding: 12px;
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 6px;
    }

    nav a.active, nav a:hover {
      background: var(--blue-soft);
      color: var(--navy);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: #0007;
      display: none;
      z-index: 90;
    }

    .overlay.show { display: block; }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px #0000000d;
    }

    .profile {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 18px;
    }

    .profile img {
      width: 100%;
      border-radius: 16px;
      border: 3px solid var(--gold);
    }

    h1, h2, h3 { color: var(--navy); margin: 0 0 10px; }
    body.dark h1, body.dark h2, body.dark h3 { color: var(--gold); }

    .motto {
      background: var(--blue-soft);
      border-left: 5px solid var(--navy2);
      padding: 12px;
      border-radius: 10px;
    }

    .edu {
      background: var(--blue-soft);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 14px;
      margin-bottom: 12px;
    }

    .edu img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      background: #fff;
      border-radius: 12px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--gold);
      margin: 2px;
    }

    .badge.green { border-color: #2e7d32; color: #2e7d32; }
    .badge.gold { border-color: #c9a227; color: #8a6d10; }
    .badge.silver { border-color: #8d99ae; color: #55606d; }
    .badge.bronze { border-color: #a5622d; color: #7c4a20; }
    .badge.white { border-color: #90a4ae; color: #546e7a; }

    .award-images {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .award-images img {
      height: 160px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .schedule-row {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .schedule-row.active {
      border-color: var(--gold);
      background: var(--blue-soft);
      font-weight: 700;
    }

    .overdue { color: #d32f2f; font-weight: 700; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    label { font-size: 13px; color: var(--muted); font-weight: 700; }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-top: 4px;
    }

    .btn {
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.gold { background: var(--gold); color: #202020; }

    .gear {
      float: right;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--navy);
    }

    body.dark .gear { color: var(--gold); }

    dialog {
      border: none;
      border-radius: 18px;
      padding: 0;
      max-width: 92vw;
      width: 620px;
    }

    dialog::backdrop { background: #0008; }

    .dialog-body { padding: 20px; background: var(--card); color: var(--text); }

    footer {
      text-align: center;
      padding: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .profile { grid-template-columns: 1fr; }
      .profile img { max-width: 240px; margin: auto; }
      main { padding: 12px; }
    }
  </style>
</head>
<body>

<header>
  <button class="icon-btn menu-btn" onclick="toggleMenu()">☰</button>
  <div class="brand">Portfolio Chissanucha Fadsura</div>
  <div class="top-actions">
    <button class="icon-btn" onclick="toggleLang()" title="ภาษา">🌐</button>
    <button class="icon-btn" onclick="toggleTheme()" title="ธีม">🌙</button>
    <button class="icon-btn" onclick="openLogin()" title="ล็อกอิน">🔑</button>
  </div>
</header>

<div class="overlay" onclick="toggleMenu()"></div>

<nav id="sideMenu">
  <a class="active" onclick="showPage('portfolio')">Portfolio</a>
  <a onclick="showPage('reading')">Reading schedule</a>
  <a onclick="showPage('list')">List Reading</a>
  <a onclick="showPage('work')">Work timetable</a>
  <a onclick="showPage('score')">ScoreTest</a>
</nav>

<main>
  <section id="page-portfolio"></section>
  <section id="page-reading" style="display:none"></section>
  <section id="page-list" style="display:none"></section>
  <section id="page-work" style="display:none"></section>
  <section id="page-score" style="display:none"></section>
</main>

<dialog id="loginDialog">
  <div class="dialog-body">
    <h2>เข้าสู่ระบบ</h2>
    <label>USERNAME<input id="loginUser"></label>
    <label>PASSWORD<input id="loginPass" type="password"></label>
    <p id="loginMsg" style="color:#d32f2f"></p>
    <button class="btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <button class="btn gold" onclick="closeDialog('loginDialog')">ปิด</button>
  </div>
</dialog>

<dialog id="formDialog">
  <div class="dialog-body">
    <h2 id="formTitle">เพิ่มข้อมูล</h2>
    <div id="formFields" class="form-grid"></div>
    <p id="formMsg"></p>
    <button class="btn" onclick="submitForm()">บันทึก</button>
    <button class="btn gold" onclick="closeDialog('formDialog')">ปิด</button>
  </div>
</dialog>

<footer>©Portfolio Chissanucha Fadsura ALLRIGHT RESERVED</footer>

<script>
let token = localStorage.getItem('portfolio_token') || '';
let lang = localStorage.getItem('portfolio_lang') || 'th';
let currentForm = null;

const T = {
  th: {
    portfolio: 'Portfolio', reading: 'Reading schedule',
    list: 'List Reading', work: 'Work timetable', score: 'ScoreTest',
    login: 'เข้าสู่ระบบ', logout: 'ออกจากระบบ', save: 'บันทึก',
    add: 'เพิ่มข้อมูล', requiredLogin: 'หน้านี้ต้องเข้าสู่ระบบ'
  },
  en: {
    portfolio: 'Portfolio', reading: 'Reading schedule',
    list: 'List Reading', work: 'Work timetable', score: 'ScoreTest',
    login: 'Login', logout: 'Logout', save: 'Save',
    add: 'Add data', requiredLogin: 'Login required'
  }
};

function t(key) { return T[lang][key] || key; }

function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('portfolio_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}

function toggleLang() {
  lang = lang === 'th' ? 'en' : 'th';
  localStorage.setItem('portfolio_lang', lang);
  location.reload();
}

function toggleMenu() {
  document.getElementById('sideMenu').classList.toggle('open');
  document.querySelector('.overlay').classList.toggle('show');
}

function showPage(page) {
  ['portfolio','reading','list','work','score'].forEach(p => {
    document.getElementById('page-' + p).style.display = p === page ? 'block' : 'none';
  });
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  event.target.classList.add('active');
  toggleMenu();
  loadPage(page);
}

function openDialog(id) { document.getElementById(id).showModal(); }
function closeDialog(id) { document.getElementById(id).close(); }

function openLogin() { openDialog('loginDialog'); }

function doLogin() {
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;

  google.script.run
    .withSuccessHandler(res => {
      if (res.ok) {
        token = res.token;
        localStorage.setItem('portfolio_token', token);
        closeDialog('loginDialog');
        loadPage(currentPage);
      } else {
        document.getElementById('loginMsg').textContent = res.message;
      }
    })
    .login(user, pass);
}

function gear(onclick) {
  return token ? `<button class="gear" onclick="${onclick}">⚙️</button>` : '';
}

let currentPage = 'portfolio';

function loadPage(page) {
  currentPage = page;

  if (page === 'portfolio') google.script.run.withSuccessHandler(renderPortfolio).getPortfolio();
  if (page === 'reading') requireLoginThen(() => google.script.run.withSuccessHandler(renderReading).getReadingSchedule());
  if (page === 'list') requireLoginThen(() => google.script.run.withSuccessHandler(renderSubjects).getSubjects());
  if (page === 'work') requireLoginThen(() => google.script.run.withSuccessHandler(renderWork).getWork());
  if (page === 'score') google.script.run.withSuccessHandler(renderScores).getScores();
}

function requireLoginThen(fn) {
  if (!token) {
    document.getElementById('page-' + currentPage).innerHTML =
      `<div class="card"><h2>${t('requiredLogin')}</h2><button class="btn" onclick="openLogin()">${t('login')}</button></div>`;
    return;
  }
  fn();
}

function renderPortfolio(d) {
  const contacts = Object.entries(d.contacts).map(([k, v]) =>
    v.text ? `<p><a href="${v.url}" target="_blank">${k.toUpperCase()}: ${v.text}</a></p>` : ''
  ).join('');

  document.getElementById('page-portfolio').innerHTML = `
    <div class="card">
      ${gear("openForm('record')")}
      <div class="profile">
        ${d.image ? `<img src="${d.image}">` : ''}
        <div>
          <h1>${d.title}</h1>
          <h3>${d.subtitle}</h3>
          ${d.intro.map(x => `<p>${x}</p>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      ${gear("openForm('personal')")}
      <p><b>วันเกิด:</b> ${d.birth}</p>
      <p><b>อายุ:</b> ${d.age}</p>
      <p><b>เชื้อชาติ:</b> ${d.ethnicity}</p>
      <p><b>สัญชาติ:</b> ${d.nationality}</p>
      <p><b>ศาสนา:</b> ${d.religion}</p>
      <p><b>ความสามารถพิเศษ:</b></p>
      <ul>${d.abilities.map(a => `<li>${a}</li>`).join('')}</ul>
      <div class="motto"><b>คติประจำใจ:</b> ${d.motto}</div>
    </div>

    <div class="card">
      ${gear("openForm('family')")}
      <h2>ประวัติครอบครัว</h2>
      <p><b>บิดา:</b> ${d.father}</p>
      <p><b>มารดา:</b> ${d.mother}</p>
      <p><b>ที่อยู่:</b> ${d.address}</p>
    </div>

    <div class="card">
      ${gear("openForm('contact')")}
      <h2>การติดต่อ</h2>
      ${contacts}
    </div>

    <div class="card">
      ${gear("openForm('education')")}
      <h2>ประวัติการศึกษา</h2>
      <div id="eduList">กำลังโหลด...</div>
    </div>

    <div class="card">
      ${gear("openForm('award')")}
      <h2>ผลงาน</h2>
      <div id="awardList">กำลังโหลด...</div>
    </div>
  `;

  google.script.run.withSuccessHandler(renderEducation).getEducation();
  google.script.run.withSuccessHandler(renderAwards).getAwards();
}

function renderEducation(rows) {
  document.getElementById('eduList').innerHTML = rows.map(r => `
    <div class="edu">
      ${r.logo ? `<img src="${r.logo}">` : ''}
      <div>
        <h3>${r.school}</h3>
        <p>${r.affiliation}</p>
        <p><small>${r.address}</small></p>
        <p><b>GPA:</b> ${r.gpa}</p>
      </div>
    </div>
  `).join('');
}

function renderAwards(rows) {
  document.getElementById('awardList').innerHTML = rows.map(r => `
    <div class="edu" style="display:block">
      <div class="award-images">
        ${r.images.map(i => `<img src="${i}">`).join('')}
      </div>
      <span class="badge gold">${r.awardLevel}</span>
      <span class="badge ${medalClass(r.medalType)}">${r.medalType}</span>
      <span class="badge green">${r.medalCategory}</span>
      <h3>${r.title}</h3>
      <p><small>${r.organization}</small></p>
      <p><small>${r.date} | ${r.grade}</small></p>
      <ul>${r.winners.map(w => `<li>${w}</li>`).join('')}</ul>
      <ul>${r.teachers.map(w => `<li>${w}</li>`).join('')}</ul>
      <p>${r.description}</p>
    </div>
  `).join('');
}

function medalClass(v) {
  v = String(v).toLowerCase();
  if (v.includes('ทอง') && !v.includes('ทองแดง')) return 'gold';
  if (v.includes('เงิน')) return 'silver';
  if (v.includes('ทองแดง')) return 'bronze';
  return 'white';
}

function renderReading(d) {
  const now = new Date();
  const timeText = now.toTimeString().slice(0, 8);

  document.getElementById('page-reading').innerHTML = `
    <div class="card">
      <h2>${d.today}</h2>
      <h3 id="clock">${timeText}</h3>
      ${d.times.map((time, i) => `
        <div class="schedule-row ${isNow(time) ? 'active' : ''}">
          <b>${time}</b>
          <div>${d.activities[i] || ''}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function isNow(range) {
  const m = range.match(/(\d{1,2})[.:](\d{2}).*?(\d{1,2})[.:](\d{2})/);
  if (!m) return false;

  const now = new Date();
  const start = new Date(); start.setHours(+m[1], +m[2], 0);
  const end = new Date(); end.setHours(+m[3], +m[4], 0);
  return now >= start && now <= end;
}

function renderSubjects(data) {
  document.getElementById('page-list').innerHTML = data.map(g => `
    <div class="card">
      <h2>${g.grade}</h2>
      ${g.subjects.map(s => `
        <details>
          <summary><b>${s.subject}</b></summary>
          ${s.units.map(u => `
            <div class="schedule-row">
              <label>
                <input type="checkbox" ${u.allDone ? 'checked' : ''}
                  onchange="toggleUnit(${JSON.stringify(u.items.map(i => i.row))}, this.checked)">
                <b>${u.unit}</b>
              </label>
              ${u.items.map(i => `
                <label style="display:block">
                  <input type="checkbox" ${i.done ? 'checked' : ''}
                    onchange="toggleSubtopic(${i.row}, this.checked)">
                  ${i.sub}
                </label>
              `).join('')}
            </div>
          `).join('')}
        </details>
      `).join('')}
    </div>
  `).join('');
}

function toggleSubtopic(row, done) {
  google.script.run.withSuccessHandler(() => loadPage('list')).toggleSubtopic(token, row, done);
}

function toggleUnit(rows, done) {
  google.script.run.withSuccessHandler(() => loadPage('list')).toggleUnit(token, rows, done);
}

function renderWork(rows) {
  document.getElementById('page-work').innerHTML = `
    <div class="card">
      ${gear("openForm('work')")}
      <h2>Work timetable</h2>
      ${rows.map(r => `
        <div class="schedule-row">
          <label>
            <input type="checkbox" ${r.done ? 'checked' : ''}
              onchange="toggleWork(${r.row}, this.checked)">
            <b>${r.work}</b>
          </label>
          <p>${r.code} | ${r.subject} | ${r.teacher}</p>
          <p class="${r.overdue ? 'overdue' : ''}">กำหนดส่ง: ${r.dueAt}</p>
          <p><small>สั่ง: ${r.assignedAt} | บันทึก: ${r.savedAt}</small></p>
          <p><small>ที่มา: ${r.source}</small></p>
          <p><small>สถานที่ส่ง: ${r.place}</small></p>
        </div>
      `).join('')}
    </div>
  `;
}

function toggleWork(row, done) {
  google.script.run.withSuccessHandler(() => loadPage('work')).toggleWork(token, row, done);
}

function renderScores(rows) {
  document.getElementById('page-score').innerHTML = `
    <div class="card">
      ${gear("openForm('score')")}
      <h2>ScoreTest</h2>
      ${rows.map(r => `
        <div class="card">
          <h3>${r.title}</h3>
          <p><small>${r.center} ${r.round ? '| ' + r.round : ''}</small></p>
          ${r.subjects.map(s => `
            <div class="schedule-row">
              <b>${s.subject}</b>
              <p>${s.score} / ${s.full}</p>
              <div class="award-images">
                ${s.images.map(i => `<img src="${i}">`).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
  `;
}

function openForm(type) {
  currentForm = type;

  const forms = {
    record: ['image|รูปภาพ|file', 'title|ข้อความใหญ่', 'subtitle|ข้อความรอง', 'intro|ข้อความเล็ก|textarea'],
    personal: ['birth|วันเกิด|date', 'ethnicity|เชื้อชาติ', 'nationality|สัญชาติ', 'religion|ศาสนา', 'motto|คติประจำใจ', 'abilities|ความสามารถพิเศษ|textarea'],
    family: ['father|บิดา', 'mother|มารดา', 'address|ที่อยู่|textarea'],
    contact: ['tel|Tel', 'instagram|Instagram', 'facebook|Facebook', 'threads|Threads', 'line|LINE'],
    education: ['logo|โลโก้|file', 'school|ชื่อโรงเรียน', 'affiliation|สังกัด', 'address|ที่อยู่', 'gpa|GPA'],
    award: ['date|วันที่ได้รับ|date', 'grade|ระดับชั้น|select', 'awardLevel|ระดับรางวัล|select', 'medalType|ประเภทสิทธิ์เหรียญ|select', 'medalCategory|ประเภทเหรียญ', 'title|ชื่อผลงาน', 'organization|หน่วยงาน', 'images|รูปภาพ|file', 'winners|ผู้ได้รับรางวัล|textarea', 'teachers|ครูที่ปรึกษา|textarea', 'description|ความรู้สึก/อธิบาย|textarea'],
    work: ['code|รหัสวิชา|subjectCode', 'subject|ชื่อรายวิชา', 'teacher|ครูผู้สอน', 'work|ชื่องาน', 'source|ที่มา|textarea', 'assignedAt|วันเวลาสั่ง|datetime', 'dueAt|วันเวลากำหนดส่ง|datetime', 'place|สถานที่ส่ง'],
    score: ['title|ชื่อการทดสอบ', 'center|ศูนย์การทดสอบ', 'round|รอบที่', 'subject|วิชา', 'score|คะแนนที่ได้', 'full|คะแนนเต็ม', 'images|ภาพประกอบ|file']
  };

  document.getElementById('formTitle').textContent = t('add');
  document.getElementById('formFields').innerHTML = forms[type].map(f => {
    const [name, label, kind] = f.split('|');

    if (kind === 'textarea') {
      return `<label>${label}<textarea id="f_${name}" rows="3"></textarea></label>`;
    }
    if (kind === 'date') {
      return `<label>${label}<input type="date" id="f_${name}"></label>`;
    }
    if (kind === 'datetime') {
      return `<label>${label}<input type="datetime-local" id="f_${name}"></label>`;
    }
    if (kind === 'file') {
      return `<label>${label}<input type="file" id="f_${name}" accept="image/*"></label>`;
    }
    if (kind === 'select') {
      return `<label>${label}<input id="f_${name}" list="${name}_list"></label>`;
    }
    if (kind === 'subjectCode') {
      return `<label>${label}<input id="f_code" oninput="fillSubject(this.value)"></label>`;
    }
    return `<label>${label}<input id="f_${name}"></label>`;
  }).join('');

  if (type === 'award') {
    google.script.run.withSuccessHandler(opts => {
      fillDatalist('grade_list', opts.grades);
      fillDatalist('awardLevel_list', opts.levels);
      fillDatalist('medalType_list', opts.medals);
    }).getAwardOptions();
  }

  openDialog('formDialog');
}

function fillDatalist(id, items) {
  let el = document.getElementById(id);
  if (!el) {
    el = document.createElement('datalist');
    el.id = id;
    document.body.appendChild(el);
  }
  el.innerHTML = items.map(x => `<option value="${x}">`).join('');
}

function fillSubject(code) {
  google.script.run.withSuccessHandler(rows => {
    const found = rows.find(r => String(r.values[0]) === code);
    if (found) {
      document.getElementById('f_subject').value = found.values[1];
      document.getElementById('f_teacher').value = found.values[2];
    }
  }).getSubjectsRaw();
}

function submitForm() {
  const data = {};
  document.querySelectorAll('#formFields [id^="f_"]').forEach(input => {
    const key = input.id.replace('f_', '');
    data[key] = input.value;
  });

  const fileInput = document.querySelector('#formFields input[type=file]');

  const save = imageUrls => {
    if (imageUrls) data.images = imageUrls;

    const actions = {
      record: 'saveRecordField',
      education: 'addEducation',
      award: 'addAward',
      work: 'addWork',
      score: 'addScore'
    };

    google.script.run
      .withSuccessHandler(() => {
        closeDialog('formDialog');
        loadPage(currentPage);
      })
      .withFailureHandler(e => document.getElementById('formMsg').textContent = e.message)
      [actions[currentForm]](token, data);
  };

  if (fileInput && fileInput.files[0]) {
    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = e => {
      google.script.run
        .withSuccessHandler(res => save([res.url]))
        .withFailureHandler(e => document.getElementById('formMsg').textContent = e.message)
        .uploadFile(token, e.target.result.split(',')[1], file.name, file.type);
    };

    reader.readAsDataURL(file);
  } else {
    save(null);
  }
}

if (localStorage.getItem('portfolio_theme') === 'dark') {
  document.body.classList.add('dark');
}

loadPage('portfolio');
</script>
